<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#22c55e">
  <title>Green.kz</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app" id="app">
    <!-- Жоғарғы панель -->
    <header class="topbar" id="topbar">
      <button class="icon-btn back-btn" id="backBtn" aria-label="Артқа" hidden>
        <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div class="brand" id="brand">
        <span class="logo">
          <svg viewBox="2.5 3.5 18 18" aria-hidden="true">
            <path d="M6 18C6 10.5 10.5 6 18.5 5.5C18 13.5 13.5 18 6 18Z" fill="currentColor" stroke="none"/>
            <path d="M8.3 15.7L15.6 8.4" stroke="#fff" stroke-width="1.3"/>
            <path d="M4.5 19.5L6.6 17.4" stroke-width="1.6"/>
          </svg>
        </span>
        <span class="brand-name">Green<span>.kz</span></span>
      </div>
      <h1 class="screen-title" id="screenTitle" hidden></h1>
      <button class="icon-btn bell" aria-label="Хабарламалар" data-go="messages">
        <svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 01-3.4 0"/></svg>
        <i class="dot"></i>
      </button>
    </header>

    <main class="content" id="content"></main>

    <!-- Төменгі навигация -->
    <nav class="tabbar" id="tabbar">
      <button class="tab active" data-tab="home">
        <svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1z"/></svg>
        <span>Басты</span>
      </button>
      <button class="tab" data-tab="messages">
        <svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 01-11.6 7.1L4 21l1.9-5.4A8 8 0 1121 12z"/></svg>
        <span>Хабарлар</span>
      </button>
      <button class="tab qr" data-tab="qr" aria-label="QR төлем">
        <span class="qr-circle">
          <svg viewBox="0 0 24 24"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4z"/><path d="M14 14h2v2h-2zM18 14h2v2h-2zM14 18h2v2h-2zM18 18h2v2h-2z"/></svg>
        </span>
      </button>
      <button class="tab" data-tab="services">
        <svg viewBox="0 0 24 24"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"/></svg>
        <span>Сервистер</span>
      </button>
      <button class="tab" data-tab="profile">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
        <span>Профиль</span>
      </button>
    </nav>

    <!-- Модальды терезе -->
    <div class="sheet-backdrop" id="sheetBackdrop" hidden>
      <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
    </div>

    <div class="toast" id="toast" hidden></div>

    <!-- PDF қарау терезесі (цифрлық құжаттар) -->
    <div class="viewer" id="viewer" hidden>
      <header class="viewer-bar">
        <button class="icon-btn" id="viewerClose" aria-label="Жабу">
          <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <h2 id="viewerTitle"></h2>
        <button class="icon-btn" id="viewerZoomOut" aria-label="Кішірейту">
          <svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg>
        </button>
        <button class="icon-btn" id="viewerZoomIn" aria-label="Үлкейту">
          <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </header>
      <div class="viewer-body">
        <div class="viewer-scroll" id="viewerScroll"><div class="viewer-pages" id="viewerPages"></div></div>
        <div class="viewer-status" id="viewerStatus" hidden></div>
        <div class="viewer-count" id="viewerCount" hidden></div>
      </div>
    </div>

    <input type="file" id="docFile" accept="application/pdf" hidden>

    <!-- Кіру құлпы: JS іске қосылғанша да бетті жауып тұрады -->
    <div class="lock" id="lock">
      <div class="lock-hero">
        <button class="icon-btn lock-close" id="lockClose" aria-label="Жабу" hidden>
          <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
        <span class="logo lock-logo">
          <svg viewBox="2.5 3.5 18 18" aria-hidden="true">
            <path d="M6 18C6 10.5 10.5 6 18.5 5.5C18 13.5 13.5 18 6 18Z" fill="currentColor" stroke="none"/>
            <path d="M8.3 15.7L15.6 8.4" stroke="#fff" stroke-width="1.3"/>
            <path d="M4.5 19.5L6.6 17.4" stroke-width="1.6"/>
          </svg>
        </span>
        <div class="lock-brand">Green<span>.kz</span></div>
      </div>
      <div class="lock-body" id="lockBody"></div>
    </div>
  </div>

  <script src="docs.js"></script>
  <script src="lock.js"></script>
  <script src="app.js"></script>
</body>
</html>
